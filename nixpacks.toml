[phases.setup]
nixPkgs = [
  "nodejs_22",
  "nodePackages.pnpm",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.xvfb",
  "mesa",
  "expat",
  "libxkbcommon",
  "alsa-lib",
  "pango",
  "cairo",
  "glib",
  "x11vnc",
  "novnc",
  "websockify",
  "bash"
]

[phases.install]
cmds = [
  "pnpm install",
  "pnpm exec playwright install chromium --with-deps"
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "bash scripts/start.sh"
