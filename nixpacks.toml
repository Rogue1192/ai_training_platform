[phases.setup]
nixPkgs = [
  "nodejs_22",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxcb",
  "libxkbcommon",
  "mesa",
  "libGL",
  "alsa-lib",
  "pango",
  "cairo",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libXcursor",
  "xorg.libXi",
  "xorg.libXrender",
  "xorg.libXtst",
  "xorg.libxshmfence",
  "glib",
  "gtk3",
  "gdk-pixbuf"
]

[phases.install]
cmds = [
  "pnpm install",
  "pnpm exec playwright install chromium"
]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"
